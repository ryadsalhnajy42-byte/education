{% extends 'blog/base.html' %}
{% block title %}اختبار - {{ course.title }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh; flex-direction: column; text-align: center;">

<h2>اختبار: {{ course.title }}</h2>
<form method="post">
    {% csrf_token %}
    {% for quiz in quizzes %}
        <p>{{ quiz.question }}</p>
        {{ form.answer }}
    {% endfor %}
    <button type="submit" class="btn btn-primary">إرسال الإجابات</button>
</form>
{% endblock %}
